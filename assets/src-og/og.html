<!doctype html>
<!-- og:image source — 1200x630. Render with ./render.sh; never hand-edit og.jpg.
     The illustration is pulled straight from ../src-svg/hero-carpool.svg, so the
     card and the hero cannot drift apart. -->
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: flex; align-items: center; gap: 44px; padding: 0 68px;
    background: #fff;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: #123832;
  }
  .copy { flex: 1 1 0; min-width: 0; }

  .brand { display: flex; align-items: center; gap: 16px; }
  .brand svg { width: 76px; height: 76px; }
  .brand .name {
    font-size: 74px; font-weight: 700; letter-spacing: -2.4px; line-height: 1;
  }

  h1 {
    margin-top: 38px;
    font-size: 54px; font-weight: 700; letter-spacing: -1.6px; line-height: 1.13;
  }
  h1 em { font-style: normal; color: #0D9488; }

  .sub {
    margin-top: 22px; font-size: 30px; line-height: 1.42; color: #4A6D65;
    max-width: 560px;
  }

  .pill {
    display: inline-block; margin-top: 30px;
    padding: 16px 30px; border-radius: 999px;
    background: #FDE9C8; color: #8A5A16;
    font-size: 27px; font-weight: 700; letter-spacing: .2px;
  }

  .art { flex: none; width: 452px; height: 452px; }
  .art img { width: 100%; height: 100%; object-fit: contain; }
</style>

<div class="copy">
  <div class="brand">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path fill="#F59E0B" d="M12 1.5C7.3 1.5 3.5 5.3 3.5 10c0 5.6 8.5 12.5 8.5 12.5S20.5 15.6 20.5 10c0-4.7-3.8-8.5-8.5-8.5z"/>
      <circle cx="12" cy="10" r="5.6" fill="#fff"/>
      <path d="M9.2 8.6l1-1.5c.2-.3.5-.5.9-.5h1.8c.4 0 .7.2.9.5l1 1.5z" fill="#0D9488"/>
      <rect x="8.4" y="8.4" width="7.2" height="3.1" rx="1.3" fill="#0D9488"/>
      <circle cx="10.1" cy="12.1" r="1" fill="#123832"/>
      <circle cx="13.9" cy="12.1" r="1" fill="#123832"/>
    </svg>
    <span class="name">PoolMate</span>
  </div>

  <h1>Sharing is caring.<br><em>Share the ride, split the fuel.</em></h1>

  <p class="sub">Car owners and co-travellers already heading the same way — not a taxi service.</p>

  <span class="pill">Launching in Bangalore &amp; Hyderabad</span>
</div>
